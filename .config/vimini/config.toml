start_commands = [
  "open gemini://bbs.geminispace.org/",
  "open --tab gemini://station.martinrue.com/",
  "open --tab gemini://astrobotany.mozz.us/app/plant",
  "open --tab gemini://calcuode.com/gmisub-aggregate.gmi",
  "tab-prev",
  "tab-prev",
  "tab-prev",
]

styles.document_font = "DejaVu Serif"
styles.preformatted_font = "DejaVu Sans Mono"
styles.chrome_font = "DejaVu Sans Mono"
styles.spinner_frames = ["╫", "╪"]
styles.spinner_interval = 100

# SOLARIZED HEX     RGB         USE CASE
# --------- ------- ----------- ---------------
# base03    #002b36   0  43  54 Dark background
# base02    #073642   7  54  66 Dark background
# base01    #586e75  88 110 117 Content
# base00    #657b83 101 123 131 Content
# base0     #839496 131 148 150 Content
# base1     #93a1a1 147 161 161 Content
# base2     #eee8d5 238 232 213 Light background
# base3     #fdf6e3 253 246 227 Light background
# yellow    #b58900 181 137   0 Accent
# orange    #cb4b16 203  75  22 Accent
# red       #dc322f 220  50  47 Accent
# magenta   #d33682 211  54 130 Accent
# violet    #6c71c4 108 113 196 Accent
# blue      #268bd2  38 139 210 Accent
# cyan      #2aa198  42 161 152 Accent
# green     #859900 133 153   0 Accent

[styles.document.colors]
background_color = [253, 246, 227]
text_color = [88, 110, 117]
link_color = [38, 139, 210]
pre_color = [42, 161, 152]
header1_color = [88, 110, 117]
header2_color = [88, 110, 117]
header3_color = [88, 110, 117]
list_item_color = [88, 110, 117]
quote_color = [88, 110, 117]
