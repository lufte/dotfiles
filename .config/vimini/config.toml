[[url_overrides]]
url_pattern = "^gemini://(?:bbs.geminispace.org|station.martinrue.com|astrobotany.mozz.us|localhost|parser.vimini.lufte.net)"
settings.pki.client_certificate_path = "/home/lufte/.local/share/vimini/lufte.pem"
